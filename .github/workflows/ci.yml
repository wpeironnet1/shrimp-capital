name: Shrimp Capital CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: shrimp-capital-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Expo web production build
        run: npm run build
        env:
          CI: true
